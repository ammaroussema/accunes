name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-13
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install platform dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libssl-dev
          else
            brew update
            brew install pkg-config gtk+3 libusb openssl
          fi

      - name: Build
        run: cargo build --release

      - name: Clear quarantine attribute (macOS)
        if: runner.os == 'macOS'
        run: xattr -cr target/release/accunes

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: accunes-${{ matrix.name }}
          path: target/release/accunes

      - name: Ensure target is removable
        if: always()
        run: |
          chmod -R a+w target/ 2>/dev/null || true
          rm -rf target/ 2>/dev/null || true
