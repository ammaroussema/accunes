name: Release

on:
  push:
    tags:
      - 'release*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: macos-15
            name: macos-arm64
          - os: macos-15-intel
            name: macos-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install platform dependencies
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y pkg-config libgtk-3-dev libasound2-dev libudev-dev libxkbcommon-dev libwayland-dev libssl-dev
          else
            brew update
            brew install pkg-config gtk+3 libusb openssl
          fi

      - name: Build
        run: cargo build --release

      - name: Clear quarantine attribute (macOS)
        if: runner.os == 'macOS'
        run: xattr -cr target/release/accunes

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: accunes-${{ steps.get_version.outputs.version }}-${{ matrix.name }}
          path: target/release/accunes

      - name: Ensure target is removable
        if: always()
        run: |
          chmod -R a+w target/ 2>/dev/null || true
          rm -rf target/ 2>/dev/null || true

  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: nttld/setup-ndk@v1
        with:
          ndk-version: r26d

      - name: Install cargo-ndk
        run: cargo install cargo-ndk

      - name: Build Android Native Libraries
        run: |
          mkdir -p mobile/android/app/src/main/jniLibs/arm64-v8a
          mkdir -p mobile/android/app/src/main/jniLibs/armeabi-v7a
          mkdir -p mobile/android/app/src/main/jniLibs/x86_64
          cargo ndk --target aarch64-linux-android --platform 24 build --package accunes_ffi --release
          cp target/aarch64-linux-android/release/libaccunes_ffi.so mobile/android/app/src/main/jniLibs/arm64-v8a/
          cargo ndk --target armv7-linux-androideabi --platform 24 build --package accunes_ffi --release
          cp target/armv7-linux-androideabi/release/libaccunes_ffi.so mobile/android/app/src/main/jniLibs/armeabi-v7a/
          cargo ndk --target x86_64-linux-android --platform 24 build --package accunes_ffi --release
          cp target/x86_64-linux-android/release/libaccunes_ffi.so mobile/android/app/src/main/jniLibs/x86_64/

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Release APK
        working-directory: mobile/android
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > keystore/release.keystore
          fi
          gradle assembleRelease
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || 'accunes' }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || 'accunes' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'accunes' }}

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare APK artifact
        run: |
          mkdir -p apk_output
          cp mobile/android/app/build/outputs/apk/release/*.apk apk_output/AccuNES-${{ steps.get_version.outputs.version }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: accunes-android-apk
          path: apk_output/*.apk

  build-ios:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios

      - name: Build iOS Rust Static Library
        run: |
          mkdir -p mobile/ios/libs
          cargo build --package accunes_ffi --target aarch64-apple-ios --release
          cp target/aarch64-apple-ios/release/libaccunes_ffi.a mobile/ios/libs/

      - name: Build Xcode Project
        run: |
          xcodebuild build \
            -project mobile/ios/AccuNES.xcodeproj \
            -scheme AccuNES \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Get version
        id: get_version
        shell: bash
        run: |
          VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Package IPA
        run: |
          mkdir -p ipa_output/Payload
          cp -r build/Build/Products/Release-iphoneos/AccuNES.app ipa_output/Payload/
          cd ipa_output
          zip -r "AccuNES-${{ steps.get_version.outputs.version }}.ipa" Payload
          rm -rf Payload

      - uses: actions/upload-artifact@v4
        with:
          name: accunes-ios-ipa
          path: ipa_output/*.ipa

  release:
    needs: [build, build-android, build-ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package
        shell: bash
        run: |
          mkdir -p pkg
          for d in artifacts/accunes-*; do
            name=$(basename "$d")
            if [ "$name" = "accunes-android-apk" ] || [ "$name" = "accunes-ios-ipa" ]; then
              continue
            fi
            mkdir -p "pkg/$name"
            cp -r "$d"/* "pkg/$name/"
            chmod +x "pkg/$name/accunes"
            cp -r data "pkg/$name/" 2>/dev/null || true
            (cd pkg && zip -r "$name.zip" "$name")
          done

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            pkg/*.zip
            artifacts/accunes-android-apk/*.apk
            artifacts/accunes-ios-ipa/*.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
