name: Deploy AccuNES Web to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-bindgen-cli
        shell: bash
        run: |
          cargo install wasm-bindgen-cli --version 0.2.127

      - name: Build WebAssembly Core
        run: cargo build --target wasm32-unknown-unknown --release --lib

      - name: Run wasm-bindgen
        run: wasm-bindgen --target web --out-name accunes --out-dir web/pkg target/wasm32-unknown-unknown/release/accunes_core.wasm

      - name: Copy icon to web directory
        run: cp accunesicon.ico web/

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
