[package]
name = "accunes"
version = "1.7.8"
edition = "2021"
description = "Accurate NES/Famicom Emulator"

[lib]
name = "accunes_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "accunes"
path = "src/main.rs"

[dependencies]
font8x8 = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miniz_oxide = "0.8"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
winit = "0.28"
softbuffer = "0.3"
rfd = { version = "0.15", default-features = false, features = ["gtk3"] }
cpal = "0.15"
gilrs = { version = "0.10", default-features = false, features = ["xinput"] }
image = "0.24"
ureq = { version = "2.9", default-features = false, features = ["json", "native-tls"] }
arboard = "3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[profile.dev]
opt-level = 3
codegen-units = 1

