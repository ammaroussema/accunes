[package]
name = "accunes"
version = "1.8.0"
edition = "2021"
description = "Accurate NES/Famicom Emulator"

[workspace]
members = [
    ".",
    "crates/accunes_ffi",
]

[lib]
name = "accunes_core"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "accunes"
path = "src/main.rs"
required-features = ["desktop"]

[features]
default = ["desktop"]
desktop = [
    "dep:winit",
    "dep:wgpu",
    "dep:bytemuck",
    "dep:pollster",
    "dep:rfd",
    "dep:cpal",
    "dep:gilrs",
    "dep:image",
    "dep:ureq",
    "dep:arboard",
]

[dependencies]
font8x8 = "0.3.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
miniz_oxide = "0.8"

winit = { version = "0.28", optional = true }
wgpu = { version = "0.16", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
pollster = { version = "0.3", optional = true }
rfd = { version = "0.15", default-features = false, features = ["gtk3"], optional = true }
cpal = { version = "0.15", optional = true }
gilrs = { version = "0.10", default-features = false, features = ["xinput"], optional = true }
image = { version = "0.24", optional = true }
ureq = { version = "2.9", default-features = false, features = ["json", "native-tls"], optional = true }
arboard = { version = "3", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["console"] }

[build-dependencies]
cc = "1"

[target.'cfg(windows)'.build-dependencies]
embed-resource = "2.4"

[profile.dev]
opt-level = 3
codegen-units = 1
overflow-checks = false

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
panic = "abort"
